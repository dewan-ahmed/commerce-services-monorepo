apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: catalog
  namespace: demo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: catalog.demo.local
      http:
        paths:
          - path: /catalog
            backend:
              serviceName: catalog-service
              servicePort: 8080
